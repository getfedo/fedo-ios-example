name: Bug report
description: Report a problem with the ModelPulse example app.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Never paste Fedo API keys or the contents of `Secrets.xcconfig`.**
        Bugs in the FedoKit SDK itself belong in the SDK repository (see the links on the previous page).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the app
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: iOS 26.5
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or simulator
      placeholder: iPhone 17 simulator
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App commit or version
      placeholder: Commit SHA, e.g. 29f2fde
    validations:
      required: true
  - type: input
    id: fedokit-version
    attributes:
      label: FedoKit version
      placeholder: 0.3.0-beta.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant console output. Remove API keys and any other secrets before pasting.
      render: shell
