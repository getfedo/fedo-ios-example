version: 2
updates:
  # Xcode-managed SwiftPM: reads fedo-ios-example.xcodeproj/.../Package.resolved (no Package.swift needed)
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
